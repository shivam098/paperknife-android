name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test the engine
        run: ./gradlew --console=plain :core:test

      - name: Build the app
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Check that the app can't go online
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt"
          "$aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "The app asks for the INTERNET permission; PaperKnife must never go online." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: paperknife-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Pictures of the app on an emulator, with a PDF opened the way another app opens one, to review
  # the screen.
  screenshot:
    name: Screenshot
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: paperknife-android-debug
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open a PDF on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -W -n io.github.shivam098.paperknife/paperknife.app.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshot-start.png
            adb shell run-as io.github.shivam098.paperknife mkdir -p files
            adb exec-in "run-as io.github.shivam098.paperknife sh -c 'cat > files/sample.pdf'" < conformance/documents/90f66aab2200.pdf
            adb shell am start -W -a android.intent.action.VIEW -t application/pdf -d file:///data/user/0/io.github.shivam098.paperknife/files/sample.pdf -n io.github.shivam098.paperknife/paperknife.app.MainActivity
            sleep 8
            adb exec-out screencap -p > screenshot-document.png
            bash scripts/ci-tap-page.sh 0.2191 0.1365 "Hello World" screenshot-selected.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paperknife-android-screenshots
          path: screenshot-*.png
          if-no-files-found: error
