name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Run by hand with a version, such as v0.5.1-test, to also build the signed release APK.
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, such as v0.5.1; empty for a development build.
        type: string
        default: ''
  # The Release workflow runs this one with the version of the tag it publishes.
  workflow_call:
    inputs:
      version:
        description: The version to build, such as v0.5.1; empty for a development build.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test the engine
        run: ./gradlew --console=plain :core:test

      - name: Build the app
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Check that the app can't go online
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt"
          "$aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "The app asks for the INTERNET permission; PaperKnife must never go online." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: paperknife-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build, sign and check the release APK
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          KEYSTORE_BASE64: ${{ secrets.PAPERKNIFE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PAPERKNIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAPERKNIFE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAPERKNIFE_KEY_PASSWORD }}
        run: bash scripts/build-release-apk.sh

      - uses: actions/upload-artifact@v7
        if: inputs.version != ''
        with:
          name: paperknife-android-release
          path: release/
          if-no-files-found: error

  # Pictures of the app on an emulator, with a PDF opened the way another app opens one, to review
  # the screen.
  screenshot:
    name: Screenshot
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: paperknife-android-debug
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open a PDF on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -W -n io.github.shivam098.paperknife/paperknife.app.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshot-start.png
            adb shell run-as io.github.shivam098.paperknife mkdir -p files
            adb exec-in "run-as io.github.shivam098.paperknife sh -c 'cat > files/sample.pdf'" < conformance/documents/90f66aab2200.pdf
            adb shell am start -W -a android.intent.action.VIEW -t application/pdf -d file:///data/user/0/io.github.shivam098.paperknife/files/sample.pdf -n io.github.shivam098.paperknife/paperknife.app.MainActivity
            sleep 8
            adb exec-out screencap -p > screenshot-document.png
            bash scripts/ci-tap-page.sh 0.2191 0.1365 "Hello World" screenshot-selected.png
            bash scripts/ci-edit-text.sh "Hello PaperKnife" "Text updated" screenshot-edited.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paperknife-android-screenshots
          path: screenshot-*.png
          if-no-files-found: error

  # The conformance corpus on Android: the app's instrumented tests, among them DeviceConformanceTest,
  # which runs every case in the app's process on an emulator, with Android's PDFium, ART and JNA.
  device-corpus:
    name: Corpus on Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the app and its instrumented tests
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the corpus on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/ci-device-corpus.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paperknife-android-device-corpus
          path: |
            device-corpus.log
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: error
