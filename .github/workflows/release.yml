name: Release

# Pushing a tag such as v0.5.1 runs the CI workflow with that version (the engine's tests, the app
# on an emulator, the conformance corpus on Android, and the release APK, signed with the release
# key in the repository's secrets and checked), then publishes a GitHub release with the APK and
# its checksum. See CONTRIBUTING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: paperknife-android-release
          path: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(release create "$TAG" release/* --title "PaperKnife for Android ${TAG#v}" --verify-tag)
          if [ -f "docs/releases/$TAG.md" ]; then
            args+=(--notes-file "docs/releases/$TAG.md")
          else
            args+=(--generate-notes)
          fi
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
